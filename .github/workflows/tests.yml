name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run portable unit tests
        env:
          PYTHONPATH: tests
        run: >-
          python -m unittest -v
          test_backup_restore
          test_end_to_end
          test_export_xlsx
          test_fund_category_catalog
          test_refund_component_fixture
          test_server
      - name: Run application self-check
        run: python app.py --self-check --data-dir "${{ runner.temp }}/douyin-reconciliation-self-check"
